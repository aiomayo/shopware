name: AI Triage — Wrapper Tests

# Runs the wrapper-side unit tests (colocated *.spec.ts) and the Zod → JSON Schema
# drift check. Triggered only when the AI-triage wrapper itself, the skill, or
# its workflow changes — keeps PRs unaffected by this folder fast.

on:
  push:
    branches:
      - trunk
    paths:
      - '.github/bin/js/ai-triage/**'
      - '.claude/skills/triage/**'
      - '.github/workflows/ai-triage.yml'
      - '.github/workflows/ai-triage-tests.yml'
  pull_request:
    paths:
      - '.github/bin/js/ai-triage/**'
      - '.claude/skills/triage/**'
      - '.github/workflows/ai-triage.yml'
      - '.github/workflows/ai-triage-tests.yml'
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-triage-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node LTS
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 'lts/*'

      # --ignore-scripts: skip postinstall of agent CLIs (we don't need their native
      # binaries to run pure-TS unit tests; saves ~30s + avoids requiring secrets).
      - name: Install deps (no scripts)
        working-directory: .github/bin/js/ai-triage
        run: npm ci --ignore-scripts

      - name: Unit tests (node --test)
        working-directory: .github/bin/js/ai-triage
        run: npm test

      # Verifies schemas/triage-output.schema.json is in sync with the Zod source
      # of truth in skill/output.ts. Fails the run with a clear remediation hint
      # if `npm run schema:generate` would change the committed file.
      - name: JSON Schema sync check
        working-directory: .github/bin/js/ai-triage
        run: npm run schema:check
