name: AI Triage

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true
        type: number
      engine:
        description: 'Agent runtime (opencode is default; codex/claude for cross-engine eval)'
        required: false
        type: choice
        default: opencode
        options:
          - opencode
          - codex
          - claude
      debug:
        description: 'Verbose mode (streams agent transcript to artifact; off by default to avoid PII leak)'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run (output to artifact only, no comment)'
        required: false
        type: boolean
        default: true

# NEVER add `contents: write`, `issues: write`, or `pull-requests: write` here.
# The agent has broad Bash tool access (rg, git log/show/diff, gh issue/pr view, ls, find);
# write scope on the GITHUB_TOKEN would let a prompt-injected agent label, close,
# or open issues, push branches, etc. When comment-posting lands (planned), wire it
# from a separate sibling job that consumes the JSON artifact — never give the agent
# the token with write scope.
permissions:
  contents: read
  issues: read

# Per-issue concurrency: blocks the same issue from racing on itself, allows different
# issues to triage in parallel. The previous OAuth-driven workflow-wide group is gone
# because API keys are stateless.
#
# `cancel-in-progress: false`: every cancellation discards an in-flight run that has
# already consumed model tokens (= burned API budget). Rapid-fire workflow_dispatch
# on the same issue would otherwise be a budget-drain vector. Queueing the next run
# instead lets the first complete; its verdict is the authoritative one.
concurrency:
  group: ai-triage-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-24.04
    # 8-minute job ceiling. AI_TRIAGE_TIMEOUT_MS=420000 (7 min) makes the engine timeout
    # fire first so the wrapper's `finally { rmSync(xdgDir) }` cleanup runs and a clear
    # "X timed out" error reaches the artifact — instead of the runner SIGKILL'ing the job.
    timeout-minutes: 8
    env:
      AI_TRIAGE_REPO: ${{ github.repository }}
      AI_TRIAGE_ENGINE: ${{ inputs.engine }}
      AI_TRIAGE_VERBOSE: ${{ inputs.debug && '1' || '0' }}
      AI_TRIAGE_TIMEOUT_MS: '420000'
      # GH_TOKEN is NOT job-level — it's scoped to each run-triage step (the steps the
      # agent actually needs gh in) so it's not present in env during `npm ci` postinstall
      # scripts (supply-chain hardening).
    steps:
      # Network egress allow-list — even if a prompt-injected agent tries to exfil,
      # outbound HTTPS is restricted to the providers + GitHub + agent CLI dependencies.
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            api.openai.com:443
            api.anthropic.com:443
            objects.githubusercontent.com:443
            github.com:443
            codeload.github.com:443
            registry.npmjs.org:443
            models.dev:443
            api.opencode.ai:443
            cdn.growthbook.io:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history so the triage agent can run `git log --since="12 months ago" -- <path>`
          # and find fix-PR commits referencing the issue number. The default shallow checkout
          # (fetch-depth: 1) makes the entire "check recent changes" step a no-op.
          fetch-depth: 0

      # `lts/*` always resolves to the current active Node LTS — no yearly maintenance.
      - name: Setup Node LTS
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 'lts/*'

      # `npm ci --ignore-scripts` prevents agent-CLI postinstall scripts from running with
      # any of the job's env (no GH_TOKEN reachable, no provider keys). The native binaries
      # are then explicitly built in a follow-up step where we know exactly what runs.
      - name: Install npm deps (no scripts)
        working-directory: .github/bin/js/ai-triage
        run: npm ci --ignore-scripts

      - name: Build agent CLI native binaries
        working-directory: .github/bin/js/ai-triage
        run: |
          # Run the postinstall scripts of the agent CLIs explicitly, AFTER `npm ci` and
          # WITHOUT any secrets in env. These scripts download/relink platform-specific
          # native binaries.
          if [ -f node_modules/opencode-ai/postinstall.mjs ]; then
            node node_modules/opencode-ai/postinstall.mjs
          fi
          if [ -f node_modules/@anthropic-ai/claude-code/install.cjs ]; then
            node node_modules/@anthropic-ai/claude-code/install.cjs || true
          fi

      # Provider keys exported only on the relevant step. opencode is multi-provider — it
      # picks the right key based on the model's `provider/` prefix, so it needs both keys
      # reachable. codex is OpenAI-only, claude is Anthropic-only. Narrower env per step =
      # smaller blast radius if the agent is prompt-injected.
      #
      # Secrets use the `QUALITY_INITIATIVE_` prefix so the namespace is visible at the
      # repo Settings → Secrets level and the keys aren't repurposed for other things.
      - name: Run triage (opencode, multi-provider)
        if: inputs.engine == 'opencode'
        working-directory: .github/bin/js/ai-triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.QUALITY_INITIATIVE_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.QUALITY_INITIATIVE_ANTHROPIC_API_KEY }}
          # Default model: Anthropic Sonnet 4.6 via opencode (best triage quality in our
          # local eval — confidence 0.97 vs 0.88 for OpenAI gpt-5.5 on issue #16599).
          # Override via `gh variable set AI_TRIAGE_OPENCODE_MODEL --body 'openai/gpt-5.5'`
          # once an OpenAI key is provisioned.
          AI_TRIAGE_OPENCODE_MODEL: ${{ vars.AI_TRIAGE_OPENCODE_MODEL || 'anthropic/claude-sonnet-4-6' }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::opencode needs at least one of QUALITY_INITIATIVE_OPENAI_API_KEY or QUALITY_INITIATIVE_ANTHROPIC_API_KEY"
            exit 1
          fi
          set -o pipefail
          # npm-script invocation prepends node_modules/.bin to PATH; node directly does not.
          # Prepend explicitly so the wrapper's `spawn("opencode" / "codex" / "claude")` finds the binaries.
          export PATH="$PWD/node_modules/.bin:$PATH"
          node triage.ts --issue-number "${{ inputs.issue_number }}" \
            > triage-result.json 2> triage-stderr.log || {
              echo "::error::triage failed — see triage-stderr.log artifact"
              tail -50 triage-stderr.log
              exit 1
            }

      - name: Run triage (codex, OpenAI)
        if: inputs.engine == 'codex'
        working-directory: .github/bin/js/ai-triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.QUALITY_INITIATIVE_OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::QUALITY_INITIATIVE_OPENAI_API_KEY secret is required for engine=codex"
            exit 1
          fi
          set -o pipefail
          # npm-script invocation prepends node_modules/.bin to PATH; node directly does not.
          # Prepend explicitly so the wrapper's `spawn("opencode" / "codex" / "claude")` finds the binaries.
          export PATH="$PWD/node_modules/.bin:$PATH"
          node triage.ts --issue-number "${{ inputs.issue_number }}" \
            > triage-result.json 2> triage-stderr.log || {
              echo "::error::triage failed — see triage-stderr.log artifact"
              tail -50 triage-stderr.log
              exit 1
            }

      - name: Run triage (claude, Anthropic)
        if: inputs.engine == 'claude'
        working-directory: .github/bin/js/ai-triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.QUALITY_INITIATIVE_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::QUALITY_INITIATIVE_ANTHROPIC_API_KEY secret is required for engine=claude"
            exit 1
          fi
          set -o pipefail
          # npm-script invocation prepends node_modules/.bin to PATH; node directly does not.
          # Prepend explicitly so the wrapper's `spawn("opencode" / "codex" / "claude")` finds the binaries.
          export PATH="$PWD/node_modules/.bin:$PATH"
          node triage.ts --issue-number "${{ inputs.issue_number }}" \
            > triage-result.json 2> triage-stderr.log || {
              echo "::error::triage failed — see triage-stderr.log artifact"
              tail -50 triage-stderr.log
              exit 1
            }

      # Defense in depth: even though the wrapper redacts the input, the agent's stdout
      # can echo content from `gh issue view` calls (other issues' bodies/comments) or
      # the agent's own reasoning. Run the same redactor over the captured outputs
      # before they become a 14-day artifact.
      - name: Redact PII from outputs
        if: always()
        working-directory: .github/bin/js/ai-triage
        run: |
          for f in triage-result.json triage-stderr.log; do
            if [ -f "$f" ]; then
              node redact-stream.ts < "$f" > "$f.redacted" && mv "$f.redacted" "$f"
            fi
          done

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ai-triage-${{ inputs.issue_number }}-${{ inputs.engine }}-${{ github.run_id }}
          path: |
            .github/bin/js/ai-triage/triage-result.json
            .github/bin/js/ai-triage/triage-stderr.log
          # Retention 7 days — wide enough to investigate a misclassification,
          # narrow enough to limit the window any leaked PII the redactor missed
          # (defence-in-depth — we redact aggressively, but assume the redactor
          # is incomplete). All repo collaborators can read workflow artifacts.
          retention-days: 7
          # Fail loud rather than warn — silent missing artifact = the redactor
          # truncated/dropped the file and no one notices until the issue is
          # already mis-triaged in a follow-up run.
          if-no-files-found: error

      - name: Summary
        if: success()
        run: |
          RESULT_FILE=.github/bin/js/ai-triage/triage-result.json
          {
            echo "## AI Triage — Issue #${{ inputs.issue_number }} (engine=${{ inputs.engine }})"
            echo ""
            echo "Dry-run mode: \`${{ inputs.dry_run }}\` (no comment posted)"
            echo "Debug mode: \`${{ inputs.debug }}\`"
            echo ""

            # Cost / token usage — per-run audit trail for budget tracking.
            # The wrapper harvests usage from each engine's structured output
            # channel (claude `--output-format json` envelope, opencode JSONL
            # events, codex stderr token lines). `null` fields mean the engine
            # did not report that dimension.
            echo "### Run metadata"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Engine | \`$(jq -r '.engine' "$RESULT_FILE")\` |"
            echo "| Wall time | $(jq -r '"\(.wall_clock_ms / 1000 | tostring | .[0:5])s"' "$RESULT_FILE") |"
            echo "| Input tokens | $(jq -r '.usage.input_tokens // "—"' "$RESULT_FILE") |"
            echo "| Output tokens | $(jq -r '.usage.output_tokens // "—"' "$RESULT_FILE") |"
            echo "| Total tokens | $(jq -r '.usage.total_tokens // "—"' "$RESULT_FILE") |"
            echo "| Cost (USD) | $(jq -r 'if .usage.total_cost_usd then "$\(.usage.total_cost_usd)" else "—" end' "$RESULT_FILE") |"
            echo "| PII redactions | $(jq -r '.redaction_counts | to_entries | map("\(.key)=\(.value)") | join(", ") // "none"' "$RESULT_FILE") |"
            echo ""

            echo "### Triage result"
            echo ""
            echo '```json'
            jq '.triage' "$RESULT_FILE"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
